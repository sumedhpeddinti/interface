services:
  # Express + React Web Service
  - type: web
    name: ganesh-cafe-pos
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: ganesh-cafe-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: ganesh-cafe-db
    plan: free
    databaseName: ganesh_cafe
    user: ganesh_user
